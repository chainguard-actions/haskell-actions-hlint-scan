name: Cleanup
concurrency: cleanup
permissions:
  packages: write

on:
  workflow_dispatch:
  schedule:
  - cron: '23 4 * * 4'

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
    - name: Delete Package Versions
      uses: actions/delete-package-versions@0d39a63126868f5eefaa47169615edd3c0f61e20 # v4
      with:
        package-type: container
        delete-only-untagged-versions: true
