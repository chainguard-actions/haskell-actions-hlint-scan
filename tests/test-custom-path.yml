name: Test HLint scan with custom path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run HLint scan on Haskell file with suggestions
        id: action
        uses: .
        continue-on-error: true
        with:
          path: ${{ github.workspace }}/pristine/haskell-actions--hlint-scan/v0.9.0/tests/fixtures/haskell-with-hints
          token: dummy-token-for-testing

      - name: Assert action ran with custom path
        run: |
          # The action may fail due to token issues when uploading SARIF,
          # but we verify it at least attempted to run (outcome is not skipped).
          OUTCOME="${{ steps.action.outcome }}"
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with custom path (outcome=$OUTCOME)"
