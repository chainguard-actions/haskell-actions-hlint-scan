name: Test HLint scan with custom path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload results to GitHub code scanning.
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify fixture Haskell file exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/tests/fixtures/custom-path/Lib.hs" ]; then
            echo "FAIL: fixture file not found"
            exit 1
          fi
          echo "PASS: fixture file found"

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/custom-path
          category: custom-path-scan
          token: ${{ github.token }}

      - name: Assert action ran with custom path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action scans Haskell code and uploads SARIF to GitHub code scanning.
          # In act, the SARIF upload may fail if code scanning is not enabled,
          # but the action should at least run (not be skipped or cancelled).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
