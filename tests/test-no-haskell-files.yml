name: Test HLint scan with no Haskell files
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload results to GitHub code scanning.
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify fixture directory exists with no Haskell files
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/tests/fixtures/empty-dir" ]; then
            echo "FAIL: fixture directory not found"
            exit 1
          fi
          count=$(find "$GITHUB_WORKSPACE/tests/fixtures/empty-dir" -name "*.hs" | wc -l)
          if [ "$count" -ne 0 ]; then
            echo "FAIL: expected no .hs files but found $count"
            exit 1
          fi
          echo "PASS: fixture directory found with no .hs files"

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/empty-dir
          token: ${{ github.token }}

      - name: Assert action ran with no Haskell files
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # When scanning a directory with no Haskell files, hlint may produce
          # empty output or exit with a non-zero code. The SARIF upload may also
          # fail in act if code scanning is not enabled.
          # We just verify the action ran (not skipped or cancelled).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
