name: Test basic HLint scan with fail-on never
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run HLint scan on clean Haskell file
        id: action
        uses: .
        with:
          path: tests/fixtures/haskell/Clean.hs
          fail-on: never

      - name: Assert action completed successfully
        run: |
          echo "Action completed without error"
          echo "PASS: HLint scan ran successfully with fail-on: never"
