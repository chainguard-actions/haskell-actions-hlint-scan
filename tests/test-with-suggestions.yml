name: Test HLint scan with suggestions present
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run HLint scan on file with suggestions (fail-on never)
        id: action
        uses: .
        with:
          path: tests/fixtures/haskell/Suggestions.hs
          fail-on: never

      - name: Assert action completed without error
        run: |
          echo "Action completed without error even with HLint suggestions present"
          echo "PASS: fail-on: never means the action never fails regardless of suggestions"
