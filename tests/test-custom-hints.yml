name: Test HLint scan with custom hints file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Haskell fixture and custom hints file
        run: |
          mkdir -p /tmp/haskell-custom
          cat > /tmp/haskell-custom/Main.hs << 'EOF'
          module Main where

          main :: IO ()
          main = putStrLn "Hello, HLint!"
          EOF

          cat > /tmp/haskell-custom/.hlint.yaml << 'EOF'
          - ignore: {name: "Use camelCase"}
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/haskell-custom
          hints: /tmp/haskell-custom/.hlint.yaml
          token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action ran with custom hints
        run: |
          echo "Action completed with custom hints file"
          echo "PASS: action step executed with custom hints configuration"
