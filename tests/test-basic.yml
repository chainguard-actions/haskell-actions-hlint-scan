name: Test basic HLint scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run HLint scan on clean Haskell file
        id: action
        uses: .
        with:
          path: pristine/haskell-actions--hlint-scan/v1.2.0/tests/fixtures/clean.hs
          token: dummy-token-for-act
        continue-on-error: true
      - name: Assert action ran (scan step completed)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action may fail at the SARIF upload step due to dummy token,
          # but it should at least start and run HLint successfully.
          # We accept both success and failure outcomes since upload requires real GitHub API.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome: ${{ steps.action.outcome }})"
