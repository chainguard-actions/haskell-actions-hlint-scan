name: Test HLint scan with hints input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_SHA: 0000000000000000000000000000000000000000
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run HLint scan with hints configuration file
        id: action
        uses: .
        with:
          path: tests/fixtures/Clean.hs
          hints: tests/fixtures/hlint.yaml
          fail-on: never
          token: ${{ github.token }}
      - name: Assert action completed successfully with hints input
        run: |
          echo "HLint scan with hints input completed without error"
          echo "PASS"
