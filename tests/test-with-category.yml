name: Test HLint scan with category
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: scan
        uses: .
        continue-on-error: true
        with:
          path: action/app
          category: test-category
          token: ${{ github.token }}

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action step ran with outcome: $OUTCOME"

      - name: Assert sarif-id output if action succeeded
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          SARIF_ID: ${{ steps.scan.outputs.sarif-id }}
        run: |
          echo "step outcome: $OUTCOME"
          echo "sarif-id: $SARIF_ID"
          if [ "$OUTCOME" = "success" ] && [ -z "$SARIF_ID" ]; then
            echo "WARN: action succeeded but sarif-id is empty (code scanning may not be enabled)"
          fi
          echo "PASS: assertion complete"
