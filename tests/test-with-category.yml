name: Test with category input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          category: my-hlint-category
          path: .
          token: ${{ github.token }}
        continue-on-error: true
      - name: Assert action ran with category input
        run: |
          echo "Action completed (category input was accepted)"
          echo "PASS"
