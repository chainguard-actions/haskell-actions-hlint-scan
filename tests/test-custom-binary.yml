name: Test custom binary input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a simple Haskell file to scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/hardened/tests/fixtures/haskell"
          cat > "$GITHUB_WORKSPACE/hardened/tests/fixtures/haskell/Main.hs" <<'EOF'
          module Main where
          main :: IO ()
          main = putStrLn "Hello, World!"
          EOF

      - id: action
        uses: .
        with:
          binary: hlint
          path: hardened/tests/fixtures/haskell
          token: ${{ github.token }}

      - name: Assert action completed
        run: |
          echo "Action completed successfully with custom binary input"
          echo "PASS"
