name: Test custom binary input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          binary: hlint
          path: .
          token: ${{ github.token }}
        continue-on-error: true
      - name: Assert action ran with binary input
        run: |
          echo "Action completed (binary input was accepted)"
          echo "PASS"
